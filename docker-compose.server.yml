# Local server overlay. The upstream compose file is a development/test setup;
# this overlay binds the dashboard to localhost and adds a stable project name.
services:
  dashboard:
    # !override replaces the upstream 0.0.0.0:8501 publication.
    ports: !override
      - "127.0.0.1:18501:8501"
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=256m
      - /home/dev/.streamlit:rw,nosuid,nodev,noexec,size=16m
    environment:
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8501/_stcore/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes: !override
      - ".:/workspace:ro"
      - "typescript_node_modules:/workspace/agent-governance-typescript/node_modules:rw"
